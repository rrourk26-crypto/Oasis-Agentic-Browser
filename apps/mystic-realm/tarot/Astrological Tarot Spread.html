  }

    height: 100%;

  .deck-card {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    background: linear-gradient(135deg, #3a1024 0%, #9d2048 100%);
    border: 3px solid #ffd700;
    transform: rotate(var(--r));
    transition: transform 0.25s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .deck-card::after {
    content: "✨";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2em;
    opacity: 0.25;
  }
  .deck-wrap:hover .deck-card {
    transform: rotate(var(--r)) translateY(-4px);
  }
  .deck-wrap.shuffling .deck-card {
    animation: deckJitter 0.55s ease-in-out;
  }
  @keyframes deckJitter {
    0%   { transform: translate(0,0) rotate(var(--r)); }
    20%  { transform: translate(-6px,-3px) rotate(calc(var(--r) - 9deg)); }
    40%  { transform: translate(5px,4px) rotate(calc(var(--r) + 11deg)); }
    60%  { transform: translate(-4px,3px) rotate(calc(var(--r) - 7deg)); }
    80%  { transform: translate(3px,-4px) rotate(calc(var(--r) + 6deg)); }

function triggerDeal(fn) {
  if (deckWrap.classList.contains("shuffling")) return;
  deckWrap.classList.add("shuffling");
  spawnSparks(deckWrap);
  setTimeout(() => {
    deckWrap.classList.remove("shuffling");
    fn();
    if (deckLabel) deckLabel.textContent = "Tap the deck to read again";
    requestAnimationFrame(flyCardsFromDeck);
  }, 550);
}

function flyCardsFromDeck() {
  const cards = layoutGrid.querySelectorAll(".card");
  const deckRect = deckWrap.getBoundingClientRect();
  const dcx = deckRect.left + deckRect.width / 2;
  const dcy = deckRect.top + deckRect.height / 2;

  cards.forEach((card, i) => {
    const rect = card.getBoundingClientRect();
    const ccx = rect.left + rect.width / 2;
    const ccy = rect.top + rect.height / 2;
    const dx = dcx - ccx;
    const dy = dcy - ccy;
    const rot = (i % 2 === 0 ? -1 : 1) * (16 + Math.random() * 12);

    card.style.transition = "none";
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(0.55)`;
    card.style.opacity = "0";
    card.getBoundingClientRect(); // force reflow

    const delay = (i * 0.12).toFixed(2);
    card.style.transition = `transform 0.65s cubic-bezier(.2,.8,.2,1) ${delay}s, opacity 0.4s ease ${delay}s`;

    requestAnimationFrame(() => {
      card.style.transform = "";
      card.style.opacity = "1";
    });

    card.addEventListener("transitionend", function cleanup(e) {
      if (e.propertyName === "transform") {
        card.style.transition = "";
        card.removeEventListener("transitionend", cleanup);
      }
    });
  });
}

function spawnSparks(anchor) {
  const rect = anchor.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < 14; i++) {
    const s = document.createElement("div");
    s.className = "shuffle-spark";
    s.textContent = Math.random() < 0.5 ? "✨" : "⭐";
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    s.style.left = cx + "px";
    s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 700);
  }
}

deckWrap.onclick = () => triggerDeal(dealAstrological);
dealBtn.onclick = () => triggerDeal(dealAstrological);
resetBtn.onclick = () => {
  layoutGrid.innerHTML = '<div class="center-circle">⭐ Zodiac Wheel ⭐</div>';
  readingSection.classList.add("hidden");
  interpretations.innerHTML = "";
  if (window.AITarot) AITarot.clear();
};

function dealAstrological() {
  layoutGrid.innerHTML = '<div class="center-circle">⭐ Zodiac Wheel ⭐</div>';
  interpretations.innerHTML = "";

  // Shuffle and select 12 cards
  const chosen = shuffle([...allCards]).slice(0, 12);
  const readingData = [];

  chosen.forEach((cardName, i) => {
    const reversed = Math.random() < 0.5;
    
    const container = document.createElement("div");
    container.className = "card-container";
    
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.index = i;
    
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front ${reversed ? "reversed" : ""}">
          <img src="cards/${cardName}" alt="${cardName}" draggable="false">
        </div>
      </div>
    `;
    
    const label = document.createElement("div");
    label.className = "labels";
    label.textContent = positions[i];
    
    card.onclick = () => {
      const wasFlipped = card.classList.contains("flipped");
      card.classList.toggle("flipped");
      
      if (!wasFlipped) {
        revealInterpretation(i);
      }
    };
    
    container.appendChild(card);
    container.appendChild(label);
    layoutGrid.appendChild(container);

    readingData.push({
      position: positions[i],
      cardName: cardName,
      reversed: reversed
    });
  });

  generateInterpretation(readingData);
  readingSection.classList.remove("hidden");

  if (window.AITarot) {
    const aiCards = readingData.map(c => {
      const m = cardMeanings[c.cardName];
      return {
        position: c.position,
        cardName: c.cardName,
        reversed: c.reversed,
        meaning: m ? (c.reversed ? m.reversed : m.upright) : ""
      };
    });
    AITarot.interpretSpread("Astrological Spread", aiCards);
  }
}

function revealInterpretation(index) {
  const interpretation = interpretations.children[index];
  if (interpretation && !interpretation.classList.contains("revealed")) {
    interpretation.classList.add("revealed");
  }
}

function generateInterpretation(readingData) {
  const positionMeanings = [
    "The 1st House represents your self, identity, physical appearance, and how you present yourself to the world.",
    "The 2nd House represents your resources, money, values, possessions, and sense of self-worth.",
    "The 3rd House represents communication, short trips, siblings, learning, and everyday interactions.",
    "The 4th House represents home, family, roots, foundations, emotional security, and your private life.",
    "The 5th House represents creativity, romance, pleasure, children, self-expression, and joy.",
    "The 6th House represents health, daily routines, work, service, pets, and self-improvement.",
    "The 7th House represents relationships, partnerships, marriage, contracts, and how you relate to others.",
    "The 8th House represents transformation, shared resources, intimacy, death, rebirth, and deep change.",
    "The 9th House represents philosophy, higher education, travel, spirituality, and expanding your horizons.",
    "The 10th House represents career, public image, reputation, ambitions, and life direction.",
    "The 11th House represents community, friendships, groups, hopes, dreams, and humanitarian causes.",
    "The 12th House represents spirituality, the subconscious, hidden matters, solitude, and inner work."
  ];

  readingData.forEach((card, index) => {
    const cardDiv = document.createElement("div");
    cardDiv.className = "card-interpretation";
    
    const cleanName = card.cardName.replace(".jpg", "").replace(/_/g, " ");
    const meaning = cardMeanings[card.cardName];
    const interpretation = card.reversed ? meaning.reversed : meaning.upright;
    
    cardDiv.innerHTML = `
      <h3>${card.position}</h3>
      <p class="card-name">${cleanName} ${card.reversed ? '<span class="reversed-indicator">(Reversed)</span>' : ''}</p>
      <p style="color: #b9a9c8; font-style: italic; margin-top: 5px;">${positionMeanings[index]}</p>
      <p class="interpretation-text">${interpretation}</p>
    `;
    
    interpretations.appendChild(cardDiv);
  });
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

    cursor: pointer;
    animation: scrollHintBounce 1.6s ease-in-out infinite;
    transition: opacity 0.4s ease;
  }
  .scroll-hint.show {
    opacity: 0.85;
    pointer-events: auto;
  }
  @keyframes scrollHintBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(10px); }
  }
</style>
<script>
(function () {
  var hint = document.getElementById("scrollHint");
  if (!hint) return;

  function check() {
    var scrollable = document.documentElement.scrollHeight > window.innerHeight + 60;
    var atTop = window.scrollY < 40;
    hint.classList.toggle("show", scrollable && atTop);
  }

  hint.addEventListener("click", function () {
    window.scrollBy({ top: window.innerHeight * 0.8, behavior: "smooth" });
  });

  window.addEventListener("scroll", check, { passive: true });
  window.addEventListener("resize", check);
  setInterval(check, 700);
  check();
})();
</script>
